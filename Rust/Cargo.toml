[workspace]
resolver = "2"
members = [
    "crates/cloudreve-protocol",
    "crates/cloudreve-store",
    "crates/cloudreve-core",
    "crates/cloudreve-ffi",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
base64 = "0.22"
rusqlite = { version = "0.37", features = ["backup", "bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
url = "2.5"
uuid = { version = "1.18", features = ["serde", "v4"] }
